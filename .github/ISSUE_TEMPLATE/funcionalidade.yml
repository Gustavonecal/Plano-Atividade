name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do usuário isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O usuário consegue...
        - [ ] O sistema impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [interface (index.html / styles.css), lógica (app.js), documentação, processo (.github / docs)]
    validations:
      required: true
